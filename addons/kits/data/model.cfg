class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class efku_lid: Default {
        skeletonBones[] = {"lid", ""};
    };
    class efku_lid1: Default {
        skeletonBones[] = {"lid", "", "latch1", ""};
    };
    class efku_lid2: Default {
        skeletonBones[] = {"lid", "", "latch1", "", "latch2", ""};
    };
};

