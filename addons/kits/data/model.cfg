// The lid of each kit model turns about its hinge (memory points "lid_axis") when the animation
// source "lid" goes from 0 to 1. Lying in an inventory or a holder the model stays closed; the
// efku_lids addon swaps a ground kit for an animated prop while someone has the inventory open.
// If a lid swings into the case instead of opening, flip the sign of its angle1.
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class efku_lid: Default {
        skeletonBones[] = {"lid", ""};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    // front lid, hinged at its foot: falls forward about 95 degrees
    class ifak: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.66;
            };
        };
    };
    // lid hinged at the back edge: up about 80 degrees
    class afak: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = -1.4;
            };
        };
    };
    // lid cap hinged at the back: up about 100 degrees
    class mfak: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = -1.75;
            };
        };
    };
    // lid cap hinged at the back: up about 100 degrees
    class mfakplus: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = -1.75;
            };
        };
    };
    // upper shell hinged at the back: up about 100 degrees
    class narcbox: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = -1.75;
            };
        };
    };
};
