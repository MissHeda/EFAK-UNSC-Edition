    // the latch first: it swings out and hangs down
    class ifak: Default {
        skeletonName = "efku_lid1";
        class Animations {
            class latch1 {
                type = "rotation";
                source = "lid";
                selection = "latch1";
                axis = "latch1_axis";
                memory = 1;
                minValue = 0;
                maxValue = 0.3;
                angle0 = 0;
                angle1 = -2.9;
            };
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0.3;
                maxValue = 1;
                angle0 = 0;
