// The lid of each kit model turns about its hinge (memory points "lid_axis") when the animation
// source "lid" goes from 0 to 1. Lying in an inventory or a holder the model stays closed; the
// efku_lids addon swaps a ground kit for an animated prop while someone has the inventory open.
// Signs checked in game (2026-11-07): back hinges open with a positive angle, the IFAK's front
// hinge with a negative one.
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class efku_lid: Default {
        skeletonBones[] = {"lid", ""};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    // lid and flap hinged at the back: up about 110 degrees
    class utility_pouch: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.92;
            };
        };
    };
    // both lids hinged at the back: up about 110 degrees
    class ammo_pouch: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.92;
            };
        };
    };
    // lid cap hinged at the back: up about 100 degrees
    class ammo_bag: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.75;
            };
        };
    };
    // lid cap hinged at the back: up about 100 degrees
    class engineer_bag: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.75;
            };
        };
    };
    // lid cap hinged at the back: up about 100 degrees
    class cbrn_bag: Default {
        skeletonName = "efku_lid";
        class Animations {
            class lid {
                type = "rotation";
                source = "lid";
                selection = "lid";
                axis = "lid_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = 1.75;
            };
        };
    };
    // shadow casters for kits lying in ground holders (efku_lids), no animation
    class utility_pouch_shadow: Default {};
    class ammo_pouch_shadow: Default {};
    class ammo_bag_shadow: Default {};
    class engineer_bag_shadow: Default {};
    class cbrn_bag_shadow: Default {};
};
