name = "EFAK: UNSC Edition"
prefix = "efku"
author = "Miss Heda"
mainprefix = "z"

[files]
include = [
    "mod.cpp",
    "logo.paa",
]

[version]
git_hash = 0

[hemtt.config]
preset = "Hemtt"

# Loads EFAK from the workshop next to this build. To test against a local EFAK checkout instead:
#
#   hemtt launch local-efak -- "-mod=<Enhanced-First-Aid-Kits repo>/.hemttout/build"
[hemtt.launch.default]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "3809430149", # Enhanced First Aid Kits
    "3812667721", # Enhanced Utility Pouches
]

[hemtt.launch.local-efak]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "3812667721", # Enhanced Utility Pouches
]

# The showroom (.hemtt/missions/EFKU_Showroom.VR): every kit on the ground, piles, an ACE Arsenal box
# and a "Play animation" action that loops the lids. Opens in Eden - play it from there.
#
#   hemtt launch showroom
[hemtt.launch.showroom]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "3809430149", # Enhanced First Aid Kits
    "3812667721", # Enhanced Utility Pouches
    "3817737577", # PH Vehicles Arsenal (attach boxes to vehicles)
]
mission = "EFKU_Showroom.VR"
